name: AISMA v2 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-validation:
    name: Backend Lint, Governance & Multi-Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi uvicorn[standard] sqlalchemy bcrypt pyjwt cryptography pydantic-settings httpx psutil pyyaml

      - name: Run Ruff Lint & Format Checks
        run: |
          python -m ruff check src tests

      - name: Run Complete Pytest Suite
        env:
          AISMA_TEST_MODE: "true"
          AISMA_MOCK_LLM: "true"
        run: |
          python -m pytest -vv

  frontend-validation:
    name: Frontend TypeScript, Lint & App Router Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Type Check (tsc)
        working-directory: ./frontend
        run: |
          npm run type-check

      - name: Lint Check (ESLint)
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          npm run test

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm run build

