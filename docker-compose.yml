version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aisma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisma_change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-aisma_v2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisma} -d ${POSTGRES_DB:-aisma_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aisma-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aisma-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://aisma:aisma_change_me_in_prod@postgres:5432/aisma_v2}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_to_a_64_char_random_production_secret}
      - INTEGRATION_VAULT_SECRET=${INTEGRATION_VAULT_SECRET:-change_this_vault_secret}
      - INTEGRATION_WEBHOOK_SECRET=${INTEGRATION_WEBHOOK_SECRET:-change_this_webhook_secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - OLLAMA_HOST=http://ollama:11434
      - AISMA_TEST_MODE=false
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - aisma-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aisma-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - aisma-net

  ollama:
    image: ollama/ollama:latest
    container_name: aisma-ollama
    restart: unless-stopped
    # Bound strictly inside internal network (no public port 11434 exposure)
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - aisma-net

volumes:
  postgres_data:
    name: aisma_postgres_data
  ollama_models:
    name: aisma_ollama_models

networks:
  aisma-net:
    name: aisma_network
    driver: bridge
